<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skedning 🔥</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }

  .container {
    padding: 25px;
    width: 100%;
  }

  h1 {
    font-size: clamp(38px, 12vw, 80px);
    margin: 0 0 25px;
  }

  #countdown {
    font-size: clamp(48px, 15vw, 100px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  .small {
    margin-top: 20px;
    font-size: 18px;
    opacity: .6;
  }

  .finished {
    animation: pulse 0.7s infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Skedning 🔥</h1>
  <div id="countdown">00:00:00</div>
  <div class="small">kvar till 18:30</div>
</div>

<script>
  const target = new Date();
  target.setHours(18, 30, 0, 0);

  function updateCountdown() {
    const now = new Date();
    const distance = target - now;

    if (distance <= 0) {
      document.getElementById("countdown").innerHTML = "NU! 🔥";
      document.getElementById("countdown").classList.add("finished");
      document.querySelector(".small").innerHTML = "SKEDNING!";
      return;
    }

    const hours = Math.floor(distance / (1000 * 60 * 60));
    const minutes = Math.floor(
      (distance % (1000 * 60 * 60)) / (1000 * 60)
    );
    const seconds = Math.floor(
      (distance % (1000 * 60)) / 1000
    );

    document.getElementById("countdown").innerHTML =
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
